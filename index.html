<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>忘见团队 · 自制综艺《挑战大世界》</title>
<style>
  :root{
    --primary:#2563eb;
    --primary-soft:#e8f0fe;
    --bg:#f7f9fc;
    --card:#ffffff;
    --text:#1f2937;
    --text-sub:#6b7280;
    --line:#e5e9f0;
    --radius:14px;
    --notice-bg:#dbeafe;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{
    scroll-behavior:smooth;
  }
  body{
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
  }
  a{
    color:inherit;
    text-decoration:none;
  }
  /* 公告通用 */
  .notice-wrap{
    background:var(--notice-bg);
    border:1px solid var(--line);
    border-radius:12px;
    max-height:130px;
    overflow-y:auto;
  }
  .notice-inner{
    padding:10px 16px;
  }
  .notice-item{
    padding:6px 0;
  }
  .notice-item a{
    color:var(--primary);
  }
  .notice-item a:hover{
    text-decoration:underline;
  }
  /* 顶部公告，无边框圆角 */
  .notice-top{
    border:none;
    border-bottom:1px solid var(--line);
    border-radius:0;
  }
  .notice-below{
    margin-bottom:24px;
  }
  /* 顶部导航 */
  header{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    max-width:1000px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
  }
  .brand{
    font-weight:700;
    font-size:20px;
    letter-spacing:1px;
  }
  .brand span{
    color:var(--primary);
  }
  .nav-links{
    display:flex;
    gap:16px;
    font-size:14px;
    color:var(--text-sub);
  }
  .nav-links a:hover{
    color:var(--primary);
  }
  /* Hero 区 */
  .hero{
    max-width:1000px;
    margin:0 auto;
    padding:48px 16px 32px;
    text-align:center;
  }
  .hero .tag{
    display:inline-block;
    padding:6px 14px;
    border-radius:999px;
    background:var(--primary-soft);
    color:var(--primary);
    font-size:13px;
    margin-bottom:18px;
  }
  .hero h1{
    font-size:34px;
    font-weight:800;
    margin-bottom:12px;
  }
  .hero p{
    color:var(--text-sub);
    font-size:16px;
    max-width:560px;
    margin:0 auto;
  }
  .music-button{
    display:inline-block;
    margin-top:20px;
    padding:10px 24px;
    background:var(--primary);
    color:#fff;
    border-radius:999px;
    font-weight:600;
    transition:0.2s ease;
  }
  .music-button:hover{
    background:#1d4ed8;
    transform:scale(1.04);
  }
  /* 通用区块 */
  section{
    max-width:1000px;
    margin:0 auto;
    padding:32px 16px;
  }
  .sec-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:6px;
  }
  .sec-sub{
    color:var(--text-sub);
    font-size:14px;
    margin-bottom:20px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
  }
  .card h3{
    font-size:17px;
    margin-bottom:8px;
  }
  .card p{
    color:var(--text-sub);
    font-size:14px;
  }
  /* 团队介绍 */
  .intro-card{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .intro-card .lead{
    font-size:16px;
    color:var(--text);
  }
  /* 成员区 */
  .member-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
  }
  .member-head{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:10px;
  }
  .avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--primary-soft);
    color:var(--primary);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:700;
    flex-shrink:0;
  }
  .member-role{
    font-size:13px;
    color:var(--primary);
  }
  .member-name{
    font-weight:700;
    font-size:16px;
  }
  .placeholder{
    border-style:dashed !important;
    color:var(--text-sub);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:140px;
    text-align:center;
  }
  .placeholder .big{
    font-size:26px;
    margin-bottom:6px;
  }
  /* 综艺专区 */
  .show-card{
    background:linear-gradient(135deg,#ffffff 0%,var(--primary-soft) 100%);
  }
  .episode-list{
    margin-top:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .episode{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 14px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:14px;
  }
  .episode .ep-status{
    color:var(--text-sub);
    font-size:13px;
  }
  /* 作品花絮 */
  .work-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
  }
  .work-cover{
    height:110px;
    border-radius:10px;
    background:var(--primary-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--primary);
    font-size:26px;
    margin-bottom:12px;
  }
  /* 底部渠道 */
  footer{
    border-top:1px solid var(--line);
    margin-top:30px;
  }
  .footer-inner{
    max-width:1000px;
    margin:0 auto;
    padding:30px 16px;
  }
  .footer-inner h3{
    font-size:17px;
    margin-bottom:16px;
  }
  .channel-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }
  .channel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .channel .platform{
    font-size:13px;
    color:var(--text-sub);
  }
  .channel .account{
    font-weight:600;
    font-size:15px;
    word-break:break-word;
    white-space:normal;
  }
  .channel .tip{
    font-size:11px;
    color:#999;
    margin-top:4px;
    line-height:1.4;
  }
  .copyright{
    text-align:center;
    color:var(--text-sub);
    font-size:13px;
    margin-top:26px;
  }
  /* 手机端 */
  @media(max-width:640px){
    .nav{
      padding:12px 14px;
    }
    .nav-links{
      gap:10px;
      font-size:12px;
    }
    .hero h1{
      font-size:26px;
    }
    .hero{
      padding:36px 14px 24px;
    }
    .member-grid{
      grid-template-columns:1fr;
    }
    .work-grid{
      grid-template-columns:1fr;
    }
    .channel-grid{
      grid-template-columns:1fr;
    }
  }
  /* 电脑端 */
  @media(min-width:720px){
    .member-grid{
      grid-template-columns:repeat(3,1fr);
    }
    .work-grid{
      grid-template-columns:repeat(3,1fr);
    }
    .channel-grid{
      grid-template-columns:repeat(3,1fr);
    }
  }
</style>
</head>
<body>
<!-- 顶部公告保留 -->
<div class="notice-wrap notice-top">
  <div class="notice-inner" id="notice-top"></div>
</div>
<header>
  <nav class="nav">
    <a class="brand" href=" ">忘见<span>团队</span></a >
    <div class="nav-links">
      <a href="#about">团队介绍</a >
      <a href="#members">成员</a >
      <a href="#show">综艺专区</a >
      <a href="#works">作品花絮</a >
      <a href="https://games.wangjiantuandui.xyz" target="_blank">游戏专区</a >
    </div>
  </nav>
</header>
<div class="hero" id="top">
  <span class="tag">自制综艺出品团队</span>
  <h1>忘见团队</h1>
  <p id="hero-slogan"></p >
  <a class="music-button" href="https://163cn.tv/blpgEBiR" target="_blank">🎵 收听单曲《无畏的冒险》</a >
</div>
<section id="about">
  <div class="sec-title">团队介绍</div>
  <div class="sec-sub">认识我们，了解团队的方向与态度</div>
  <div class="card intro-card">
    <p class="lead" id="team-intro"></p >
  </div>
</section>
<section id="members">
  <div class="sec-title">成员展示</div>
  <div class="sec-sub">团长领衔，后续成员陆续加入</div>
  <div class="member-grid" id="member-list"></div>
</section>
<section id="show">
  <div class="sec-title">综艺专区</div>
  <div class="sec-sub">团队自制综艺《挑战大世界》</div>
  <div class="card show-card">
    <h3 id="show-title"></h3>
    <p id="show-intro"></p >
    <div class="episode-list" id="episode-list"></div>
  </div>
</section>
<section id="works">
  <div class="sec-title">作品与花絮</div>
  <div class="sec-sub">节目片段、幕后花絮与最新动态</div>
  <div class="work-grid" id="work-list"></div>
</section>
<!-- 最新播报公告 -->
<section>
  <div class="notice-wrap notice-below">
    <div class="notice-inner" id="notice-below"></div>
  </div>
</section>
<footer>
  <div class="footer-inner">
    <h3>关注我们</h3>
    <div class="channel-grid" id="channel-list"></div>
    <div class="copyright">© 2026 忘见团队 · 自制综艺《挑战大世界》</div>
  </div>
</footer>
<script>
  const NOTICES = [
    {
      title:"关于《挑战大世界》拍摄延期调整的公告",
      url:"https://mp.weixin.qq.com/s/OYeQA3atXnaaJCV0tf2A1w"
    }
  ];
  function renderNotice(containerId){
    const el = document.getElementById(containerId);
    if(!el) return;
    el.innerHTML = "";
    NOTICES.forEach(item=>{
      el.innerHTML += `
        <div class="notice-item">
          📢 <a href="${item.url}" target="_blank">${item.title}</a >
        </div>
      `;
    })
  }
  renderNotice("notice-top");
  renderNotice("notice-below");
  const TEAM = {
    slogan: "我们是忘见团队，专注打造自制综艺《挑战大世界》，用镜头记录每一次挑战与成长。",
    intro: "忘见团队是一支独立的自制综艺团队，负责策划、拍摄与后期制作。目前团队正在筹备自制综艺《挑战大世界》，后续将陆续推出节目正片、幕后花絮与相关动态。"
  };
  const MEMBERS = [
    {
      name: "忘见",
      role: "团队团长 / 总策划",
      desc: "负责团队整体方向、节目策划与统筹安排。",
      placeholder: false
    },
    { placeholder: true, text: "成员待加入" },
    { placeholder: true, text: "成员待加入" }
  ];
  const SHOW = {
    title: "挑战大世界",
    intro: "一档团队自制的挑战类综艺，通过不同任务与关卡，展现参与者的勇气、协作与创意。节目详情、期数与上线安排将在此陆续更新。",
    episodes: [
      { title: "节目筹备中", status: "敬请期待" }
    ]
  };
  const WORKS = [
    { placeholder: true, text: "正片片段 · 更新中" },
    { placeholder: true, text: "幕后花絮 · 更新中" },
    { placeholder: true, text: "团队动态 · 更新中" }
  ];
  const CHANNELS = [
    { platform: "微信公众号", account: "挑战大世界", url: null },
    { platform: "抖音",       account: "挑战大世界", url: "https://v.douyin.com/e33g442WEq8/" },
    { platform: "小红书",     account: "挑战大世界", url: "https://xhslink.cn/o/7p34kxLqRLu" },
    { platform: "网易云音乐", account: "挑战大世界", url: "https://163cn.tv/blpgEBiR" },
    { platform: "哔哩哔哩",   account: "挑战大世界T", url: "https://b23.tv/6dv5r0z" }
  ];

  document.getElementById("hero-slogan").textContent = TEAM.slogan;
  document.getElementById("team-intro").textContent = TEAM.intro;
  document.getElementById("show-title").textContent = "《" + SHOW.title + "》";
  document.getElementById("show-intro").textContent = SHOW.intro;

  //渲染成员
  const memberList = document.getElementById("member-list");
  MEMBERS.forEach(m => {
    const div = document.createElement("div");
    if (m.placeholder) {
      div.className = "card placeholder";
      div.innerHTML = `<div class="big">＋</div><div>${m.text}</div>`;
    } else {
      div.className = "card";
      const initial = m.name.charAt(0);
      div.innerHTML = `
        <div class="member-head">
          <div class="avatar">${initial}</div>
          <div>
            <div class="member-name">${m.name}</div>
            <div class="member-role">${m.role}</div>
          </div>
        </div>
        <p>${m.desc}</p >`;
    }
    memberList.appendChild(div);
  });

  //渲染综艺剧集
  const episodeList = document.getElementById("episode-list");
  SHOW.episodes.forEach(ep => {
    const row = document.createElement("div");
    row.className = "episode";
    row.innerHTML = `<span>${ep.title}</span><span class="ep-status">${ep.status}</span>`;
    episodeList.appendChild(row);
  });

  //渲染作品花絮
  const workList = document.getElementById("work-list");
  WORKS.forEach(w => {
    const div = document.createElement("div");
    if (w.placeholder) {
      div.className = "card placeholder";
      div.innerHTML = `<div class="big">🎬</div><div>${w.text}</div>`;
    } else {
      div.className = "card";
      div.innerHTML = `
        <div class="work-cover">🎬</div>
        <h3>${w.title}</h3>
        <p>${w.desc}</p >`;
    }
    workList.appendChild(div);
  });

  //渲染关注渠道
  const channelList = document.getElementById("channel-list");
  CHANNELS.forEach(c => {
    const div = document.createElement("div");
    div.className = "channel";
    if (c.url) {
      div.innerHTML = `
        <a href="${c.url}" target="_blank">
          <span class="platform">${c.platform}</span>
          <span class="account">${c.account}</span>
        </a >`;
    } else {
      div.innerHTML = `
        <span class="platform">${c.platform}</span>
        <span class="account">${c.account}</span>
        <span class="tip">微信搜一搜搜索账号</span>`;
    }
    channelList.appendChild(div);
  });
</script>
</body>
</html>
